[package]
name = "integrate"
version = "0.3.0"
edition = "2021"

authors = ["Mahdi Tantaoui <mohamedalmahdi.tantaoui@gmail.com>"]
description = " Small, lightweight Rust library for performing numerical integration."
rust-version = "1.74"
license = "MIT"
repository = "https://github.com/mtantaoui/Integrate"
documentation = "https://docs.rs/integrate/"
readme = "README.md"
keywords = ["math", "integral", "Gauss", "performance",  "Numerical"]


[dependencies]
itertools = "0.13.0"
num = "0.4.1"
num-traits = "0.2.18"

[dev-dependencies]
codspeed-criterion-compat = { version = "2", features = ["html_reports"] }

[[bench]]
name = "newton_cotes"
harness = false

[[bench]]
name = "gauss_quadrature"
harness = false

[[bench]]
name = "adaptive"
harness = false

[package.metadata.docs.rs]
rustdoc-args = [ "--html-in-header", "./docs/docs-header.html" ]